<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>生成记录中心</title>
  <link rel="stylesheet" href="/static/css/workspace.css?v=history-download-fetch-20260504-4">
  <style>
    :root {
      --bg: #0b0f14;
      --bg-soft: #111722;
      --panel: rgba(18, 24, 34, 0.86);
      --line: rgba(255, 255, 255, 0.1);
      --line-strong: rgba(255, 255, 255, 0.16);
      --text: #e9eef6;
      --muted: #92a0b3;
      --accent: #7ee0c3;
      --accent-2: #7da4ff;
      --danger: #ff6b6b;
      --warning: #ffc45c;
      --shadow: 0 20px 60px rgba(0, 0, 0, 0.38);
      --radius-xl: 28px;
      --radius-lg: 20px;
      --radius-md: 14px;
      --radius-sm: 10px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: linear-gradient(180deg, #ffffff 0%, #f7f8fa 100%);
      color: var(--text);
      font-family: "Georgia", "Times New Roman", serif;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    body::before {
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.028) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.028) 1px, transparent 1px);
      background-size: 38px 38px;
      mask-image: radial-gradient(circle at center, black 52%, transparent 100%);
      opacity: 0.35;
    }

    body::after {
      background: repeating-linear-gradient(
        180deg,
        rgba(255, 255, 255, 0.03) 0,
        rgba(255, 255, 255, 0.03) 1px,
        transparent 1px,
        transparent 4px
      );
      mix-blend-mode: soft-light;
      opacity: 0.08;
    }

    a { color: inherit; }

    .page {
      position: relative;
      width: min(1560px, calc(100vw - 24px));
      margin: 0 auto;
      padding: 14px 0 28px;
      color: #ffffff;
    }

    .topbar {
      position: sticky;
      top: 98px;
      z-index: 20;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      padding: 16px 18px;
      margin-bottom: 18px;
      border-radius: 24px;
      background: linear-gradient(180deg, rgba(21, 27, 38, 0.92), rgba(14, 18, 25, 0.88));
      border: 1px solid rgba(255, 255, 255, 0.09);
      box-shadow: 0 18px 42px rgba(0, 0, 0, 0.34);
      backdrop-filter: blur(18px);
    }

    .topbar-section { min-width: 0; }

    .console-topbar {
      position: sticky;
      top: 12px;
      z-index: 30;
      margin-bottom: 12px;
      background: rgba(255, 255, 255, 0.88);
      border-color: rgba(15, 23, 42, 0.08);
      box-shadow: 0 18px 48px rgba(15, 23, 42, 0.08);
    }

    .console-topbar .btn {
      color: #111827;
    }

    .console-topbar .console-home {
      background: #111827;
      border-color: rgba(15, 23, 42, 0.14);
      color: #ffffff;
      text-decoration: none;
    }

    .console-topbar .console-title {
      color: #111827;
      font-family: "Segoe UI Variable Display", "PingFang SC", "Microsoft YaHei UI", sans-serif;
    }

    .console-topbar .console-pill {
      text-decoration: none;
      cursor: pointer;
    }

    .console-topbar .console-pill:hover {
      border-color: rgba(17, 24, 39, 0.28);
      color: #111827;
      transform: translateY(-1px);
    }

    .toolbar-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .tool-btn {
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.04);
      color: var(--text);
      border-radius: 999px;
      padding: 10px 14px;
      font-size: 12px;
      letter-spacing: 0.02em;
      text-decoration: none;
      cursor: pointer;
      transition: transform .18s ease, border-color .18s ease, background .18s ease, opacity .18s ease;
      white-space: nowrap;
      user-select: none;
    }

    .tool-btn:hover {
      transform: translateY(-1px);
      border-color: rgba(17,24,39,0.18);
      box-shadow: 0 8px 18px rgba(17,24,39,0.06);
    }

    .toolbar-actions {
      justify-content: flex-end;
    }

    #downloadBtn {
      color: #ffffff;
    }

    .tool-btn.primary {
      background: linear-gradient(135deg, rgba(126,224,195,0.96), rgba(125,164,255,0.96));
      color: #071017;
      border-color: transparent;
      font-weight: 700;
    }

    .tool-btn.disabled,
    .tool-btn:disabled {
      opacity: 0.42;
      cursor: not-allowed;
      transform: none;
    }

    .shell {
      display: grid;
      grid-template-columns: 1fr;
      gap: 18px;
    }

    .hero {
      padding: 24px;
      border-radius: var(--radius-xl);
      background: linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.025));
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
      overflow: hidden;
      position: relative;
    }

    .hero::before {
      content: none;
    }

    .hero-inner {
      position: relative;
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 18px;
      align-items: end;
    }

    .eyebrow {
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.18em;
      font-size: 12px;
      margin-bottom: 14px;
    }

    .hero h1 {
      margin: 0;
      font-size: clamp(34px, 4vw, 58px);
      line-height: 0.98;
      letter-spacing: -0.04em;
      max-width: 10ch;
    }

    .hero p {
      margin: 16px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.8;
      max-width: 68ch;
    }

    .hero-stats {
      display: grid;
      gap: 10px;
      justify-self: end;
      width: min(100%, 420px);
    }

    .hero-card {
      padding: 16px 18px;
      border-radius: 18px;
      background: #ffffff;
      border: 1px solid rgba(17,24,39,0.08);
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
    }

    .hero-card strong { font-size: 14px; }
    .hero-card span { display: block; margin-top: 4px; color: var(--muted); font-size: 12px; }

    .stat-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 72px;
      padding: 8px 10px;
      border-radius: 999px;
      background: #ffffff;
      border: 1px solid rgba(17,24,39,0.16);
      color: #000000;
      font-size: 12px;
    }

    .timeline-block {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .timeline-group {
      padding: 0;
      background: transparent;
      border: 0;
      box-shadow: none;
      backdrop-filter: none;
      position: relative;
      overflow: visible;
    }

    .timeline-group::before {
      content: "";
      position: absolute;
      left: 18px;
      top: 0;
      bottom: 0;
      width: 1px;
      background: linear-gradient(180deg, rgba(17,24,39,0.16), transparent 90%);
      opacity: .35;
    }

    .group-head {
      display: flex;
      align-items: center;
      gap: 12px;
      padding-left: 18px;
      margin-bottom: 16px;
    }

    .group-head h2 {
      margin: 0;
      font-size: 16px;
      line-height: 1.2;
      letter-spacing: 0;
      color: #000000;
      font-weight: 600;
    }

    .waterfall-grid {
      padding-left: 18px;
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      justify-content: flex-start;
      align-items: flex-start;
      width: 100%;
      box-sizing: border-box;
    }

    .image-card {
      position: relative;
      width: 108px;
      height: 108px;
      border-radius: 18px;
      overflow: hidden;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
      cursor: pointer;
      transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease;
      animation: floatIn .45s ease both;
      user-select: none;
      touch-action: manipulation;
    }

    .image-card:hover {
      transform: translateY(-2px);
      border-color: rgba(17,24,39,0.14);
      box-shadow: 0 10px 22px rgba(17,24,39,0.08);
    }

    .image-card.selected {
      border-color: rgba(126,224,195,0.95);
      box-shadow: 0 0 0 2px rgba(126,224,195,0.28), 0 10px 22px rgba(17,24,39,0.08);
    }

    .image-card.drag-over {
      border-color: rgba(125,164,255,0.9);
      box-shadow: 0 0 0 1px rgba(125,164,255,0.3), 0 10px 22px rgba(17,24,39,0.08);
    }

    .select-box {
      position: absolute;
      left: 4px;
      top: 4px;
      width: 14px;
      height: 14px;
      border-radius: 4px;
      background: rgba(255,255,255,0.86);
      border: 1px solid rgba(17,24,39,0.22);
      display: grid;
      place-items: center;
      color: transparent;
      font-size: 10px;
      z-index: 2;
      backdrop-filter: blur(4px);
      pointer-events: none;
    }

    .image-card.selected .select-box {
      background: rgba(126,224,195,0.92);
      border-color: rgba(126,224,195,0.92);
      color: #081019;
    }

    .thumb {
      display: block;
      width: 100%;
      height: 100%;
      min-height: 108px;
      border-radius: inherit;
      background-repeat: no-repeat;
      background-size: cover;
      background-position: center;
    }

    .thumb img {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: inherit;
      object-fit: cover;
    }

    .thumb::after {
      content: none;
    }

    .image-card.previewing .thumb {
      outline: 2px solid rgba(125,164,255,0.55);
      outline-offset: -2px;
    }

    .range-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 40;
      display: none;
    }

    .range-overlay.active { display: block; }

    .range-box {
      position: absolute;
      border: 1px solid rgba(125,164,255,0.8);
      background: rgba(125,164,255,0.12);
      box-shadow: 0 0 0 1px rgba(125,164,255,0.22), inset 0 0 0 1px rgba(125,164,255,0.18);
      border-radius: 10px;
    }

    .preview-modal {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(5, 8, 12, 0.74);
      backdrop-filter: blur(14px);
      z-index: 60;
    }

    .preview-modal.open { display: flex; }

    .preview-card {
      width: min(1120px, 100%);
      border-radius: 28px;
      overflow: hidden;
      background: linear-gradient(180deg, rgba(18,24,34,0.98), rgba(11,15,20,0.98));
      border: 1px solid rgba(255,255,255,0.12);
      box-shadow: 0 30px 90px rgba(0,0,0,0.52);
    }

    .preview-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 16px 18px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    .preview-head strong { font-size: 15px; }
    .preview-head span { color: var(--muted); font-size: 12px; }

    .preview-body {
      display: grid;
      grid-template-columns: 1.18fr 0.82fr;
    }

    .preview-stage {
      min-height: 560px;
      display: grid;
      place-items: center;
      padding: 28px;
      background:
        radial-gradient(circle at 20% 20%, rgba(126,224,195,0.2), transparent 28%),
        radial-gradient(circle at 80% 30%, rgba(125,164,255,0.22), transparent 30%),
        linear-gradient(135deg, #16202d 0%, #111722 48%, #0b0f14 100%);
    }

    .preview-frame {
      width: min(78%, 440px);
      aspect-ratio: 1 / 1.24;
      border-radius: 26px;
      border: 1px solid rgba(255,255,255,0.12);
      background:
        linear-gradient(160deg, rgba(126,224,195,0.24), rgba(125,164,255,0.24)),
        radial-gradient(circle at top, rgba(255,255,255,0.26), transparent 30%);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08), 0 20px 50px rgba(0,0,0,0.4);
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    .preview-frame img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      background: #ffffff;
    }

    .preview-frame.empty {
      background:
        linear-gradient(160deg, rgba(126,224,195,0.24), rgba(125,164,255,0.24)),
        radial-gradient(circle at top, rgba(255,255,255,0.26), transparent 30%);
    }

    .load-more-bar {
      display: none;
      justify-content: center;
      padding: 18px 0 6px;
    }

    .load-more-bar .tool-btn {
      min-width: 168px;
    }

    #loadMoreBtn {
      color: #000000;
    }

    .preview-side {
      padding: 18px;
      border-left: 1px solid rgba(255,255,255,0.08);
      display: grid;
      gap: 12px;
    }

    .side-card {
      padding: 14px;
      border-radius: 18px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
    }

    .side-card h4 { margin: 0 0 8px; font-size: 13px; }
    .side-card p { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.7; }

    .preview-actions {
      display: grid;
      gap: 10px;
    }

    .preview-btn {
      border: 0;
      border-radius: 14px;
      padding: 13px 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .preview-btn.primary {
      background: linear-gradient(135deg, #7ee0c3, #7da4ff);
      color: #071017;
    }

    .preview-btn.ghost {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.1);
      color: var(--text);
    }

    @keyframes floatIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 1320px) {
      .hero-inner,
      .preview-body {
        grid-template-columns: 1fr;
      }

      .toolbar-actions {
        justify-content: flex-start;
      }

      .hero-stats {
        justify-self: stretch;
        width: 100%;
      }

      .preview-side {
        border-left: 0;
        border-top: 1px solid rgba(255,255,255,0.08);
      }
    }

    @media (max-width: 1100px) {
      .waterfall-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }

    @media (max-width: 860px) {
      .page { width: min(100vw - 16px, 1560px); }
      .waterfall-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .console-topbar {
        position: relative;
        top: auto;
        align-items: flex-start;
        flex-direction: column;
      }
      .topbar {
        top: 12px;
        padding: 14px;
      }
    }

    @media (max-width: 640px) {
      .waterfall-grid { grid-template-columns: 1fr; }
      .hero h1 { max-width: none; }
      .toolbar-actions { gap: 8px; }
      .tool-btn { padding: 9px 11px; }
      .preview-stage { min-height: 420px; }
    }
  </style>

<body data-page-mode="generation-record">
  <div class="page">
    <header class="console-topbar" data-shared-topbar>
      <div class="console-brand">
        <a class="console-home" href="/generation-record" data-topbar-home>生成记录</a>
        <div>
          <div class="console-kicker" data-topbar-kicker>Generation Record / History Workspace</div>
          <div class="console-title" data-topbar-title>生成记录中心</div>
        </div>
      </div>
      <div class="console-topbar-meta" data-topbar-meta></div>
    </header>

    <header class="topbar">
        <div class="topbar-section">
          <div class="toolbar-actions">
            <button class="tool-btn" id="downloadBtn">下载</button>
          </div>
        </div>
      </header>

    <main class="timeline-block" id="timelineBlock"><div style="color:#000;padding:40px 0;">正在读取历史生成记录...</div></main>
  </div>

  <div class="range-overlay" id="rangeOverlay">
    <div class="range-box" id="rangeBox"></div>
  </div>

  <div class="preview-modal" id="previewModal" aria-hidden="true">
    <div class="preview-card">
      <div class="preview-head">
        <div>
          <strong id="previewTitle">图片预览</strong><br>
          <span id="previewSubTitle">COS 直链预览</span>
        </div>
        <button class="tool-btn" id="closePreviewBtn">关闭</button>
      </div>
      <div class="preview-body">
        <div class="preview-stage">
          <div class="preview-frame" id="previewFrame"></div>
        </div>
        <aside class="preview-side">
          <div class="side-card">
            <h4>图片信息</h4>
            <p id="previewInfo">支持查看标签、分类、日期和来源信息。</p>
          </div>
          <div class="side-card">
            <h4>标签</h4>
            <p id="previewTags">六并发复测 #1/2/3</p>
          </div>
          <div class="side-card">
            <h4>来源</h4>
            <p id="previewSource">COS / generated</p>
          </div>
          <div class="preview-actions">
            <button class="preview-btn primary" id="previewDownloadBtn">下载当前图片</button>
          </div>
        </aside>
      </div>
    </div>
  </div>

  <script>
    const state = {
      sourceReady: false,
      loadingMore: false,
      offset: 0,
      limit: 50,
      hasMore: false,
      selected: new Set(),
      previewId: null,
      visibleDays: Number.POSITIVE_INFINITY,
      dayStep: 5,
      totalDays: 0,
    };

    const timelineBlock = document.getElementById('timelineBlock');
    const downloadBtn = document.getElementById('downloadBtn');
    const previewModal = document.getElementById('previewModal');
    const previewTitle = document.getElementById('previewTitle');
    const previewSubTitle = document.getElementById('previewSubTitle');
    const previewInfo = document.getElementById('previewInfo');
    const previewTags = document.getElementById('previewTags');
    const previewSource = document.getElementById('previewSource');
    const previewFrame = document.getElementById('previewFrame');
    const rangeOverlay = document.getElementById('rangeOverlay');
    const rangeBox = document.getElementById('rangeBox');
    const loadMoreBar = document.createElement('div');
    loadMoreBar.className = 'load-more-bar';
    loadMoreBar.innerHTML = '<button class="tool-btn" id="loadMoreBtn">加载更多</button>';
    timelineBlock.parentNode.appendChild(loadMoreBar);
    const loadMoreBtn = loadMoreBar.querySelector('#loadMoreBtn');

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>'"]/g, (char) => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        "'": '&#39;',
        '"': '&quot;',
      }[char]));
    }

    function getTaskImages(task) {
      const result = task?.result || {};
      const images = [];
      const pools = [result.images, result.reference_images, result.items, result.outputs];
      pools.forEach((pool) => {
        if (!Array.isArray(pool)) return;
        pool.forEach((image, index) => {
          const url = image?.url || image?.image_url || image?.cos_url || image?.src || image?.href || image?.download_url || '';
          if (!url) return;
          images.push({
            id: image?.id || image?.key || `${task.task_id}-image-${images.length + index}`,
            url,
            title: image?.title || image?.label || task.details || task.mode || '历史图片',
            tags: image?.tags || [],
          });
        });
      });
      return images;
    }

    function toGalleryGroups(items) {
      const sortedItems = [...items].sort((a, b) => new Date(b.created_at || 0) - new Date(a.created_at || 0));
      const bucket = new Map();
      sortedItems.forEach((item) => {
        const createdAt = item.created_at ? new Date(item.created_at) : null;
        const dateKey = createdAt && !Number.isNaN(createdAt.getTime()) ? createdAt.toISOString().slice(0, 10) : 'unknown';
        const label = dateKey === 'unknown' ? '未知日期' : `${createdAt.getMonth() + 1}月${createdAt.getDate()}日`;
        if (!bucket.has(dateKey)) {
          bucket.set(dateKey, { date: dateKey, label, items: [] });
        }
        const imageUrl = String(item.image_url || item.url || '').trim();
        if (!imageUrl) return;
        bucket.get(dateKey).items.push({
          id: item.id || `${item.task_id || 'task'}-${bucket.get(dateKey).items.length}`,
          title: item.title || item.mode || '历史记录',
          tags: Array.isArray(item.tags) ? item.tags : [],
          source: item.source || 'COS',
          kind: 'generated',
          favorite: false,
          imageUrl,
          originalUrl: item.original_url || imageUrl,
          thumbUrl: item.thumb_url || imageUrl,
          task: item,
        });
      });
      return [...bucket.values()].filter((group) => group.items.length).sort((a, b) => b.date.localeCompare(a.date));
    }

    let galleryData = [];

    async function waitForSharedTopbarSync(timeout = 5000) {
      const startedAt = Date.now();
      while (!window.__sharedTopbarSyncServerSession && Date.now() - startedAt < timeout) {
        await new Promise((resolve) => setTimeout(resolve, 50));
      }
      return window.__sharedTopbarSyncServerSession || null;
    }

    async function getExistingServerSession() {
      try {
        const response = await fetch('/api/auth/session', {
          method: 'POST',
          headers: { Accept: 'application/json' },
          credentials: 'same-origin',
          cache: 'no-store',
        });
        const payload = await response.json().catch(() => ({}));
        return payload?.session || null;
      } catch (error) {
        return null;
      }
    }

    async function ensureServerSession() {
      const syncServerSession = await waitForSharedTopbarSync();
      if (syncServerSession) {
        try {
          const syncedSession = await syncServerSession();
          if (syncedSession) return syncedSession;
        } catch (error) {
        }
      }
      return getExistingServerSession();
    }

    async function loadHistoryData(reset = false) {
      if (state.loadingMore) return;
      state.loadingMore = true;
      updateLoadMoreState();
      if (reset) {
        state.offset = 0;
        state.hasMore = false;
        state.visibleDays = Number.POSITIVE_INFINITY;
        galleryData = [];
      }
      const serverSession = await ensureServerSession();
      const currentUser = serverSession?.user || null;
      const currentUserLabel = currentUser?.phone || currentUser?.email || currentUser?.id || '未知账号';
      if (!serverSession) {
        state.loadingMore = false;
        state.sourceReady = true;
        updateLoadMoreState();
        timelineBlock.innerHTML = '<div style="color:#000;padding:40px 0;">请先点击右上角账号面板登录，登录后这里会显示当前账号的生成记录。</div>';
        return;
      }
      const response = await fetch(`/api/generation-history?limit=${state.limit}&offset=${state.offset}`, { credentials: 'same-origin', cache: 'no-store' });
      const payload = await response.json();
      if (!response.ok || !payload.success) {
        state.loadingMore = false;
        updateLoadMoreState();
        throw new Error(payload.error || '读取历史生成数据失败');
      }
      const nextGroups = toGalleryGroups(payload.items || []);
      const merged = new Map();
      [...galleryData, ...nextGroups].forEach((group) => {
        if (!merged.has(group.date)) {
          merged.set(group.date, { date: group.date, label: group.label, items: [] });
        }
        const current = merged.get(group.date);
        group.items.forEach((item) => {
          if (!current.items.some((existing) => existing.id === item.id)) {
            current.items.push(item);
          }
        });
      });
      galleryData = [...merged.values()].sort((a, b) => b.date.localeCompare(a.date));
      state.totalDays = galleryData.length;
      state.offset = Number(payload.next_offset || state.offset + (payload.items || []).length);
      state.hasMore = Boolean(payload.has_more);
      state.sourceReady = true;
      state.loadingMore = false;
      renderTimeline(currentUserLabel);
      updateLoadMoreState();
    }

    function updateDownloadButtonState() {
      const count = state.selected.size;
      downloadBtn.disabled = count <= 0;
      downloadBtn.classList.toggle('disabled', count <= 0);
      downloadBtn.textContent = count > 0 ? `下载已选 ${count} 张` : '下载';
    }

    function updateLoadMoreState() {
      if (!loadMoreBtn) return;
      loadMoreBtn.disabled = state.loadingMore || !state.hasMore;
      loadMoreBtn.textContent = state.loadingMore ? '加载中...' : (state.hasMore ? '加载更多' : '没有更多了');
      loadMoreBar.style.display = state.sourceReady ? 'flex' : 'none';
    }

    function getAllItems() {
      return galleryData.flatMap((group) => group.items.map((item) => ({ ...item, date: group.date, dateLabel: group.label })));
    }

    function getVisibleItems() {
      return getAllItems();
    }

    function getItemById(id) {
      return getAllItems().find((item) => item.id === id);
    }

    function getSelectedItems() {
      return [...state.selected].map((id) => getItemById(id)).filter(Boolean);
    }

    function getOriginalUrl(item) {
      return item?.originalUrl || item?.original_url || item?.imageUrl || '';
    }

    function stripImageProcessQuery(url) {
      const rawUrl = String(url || '').trim();
      if (!rawUrl) return '';
      try {
        const parsed = new URL(rawUrl, window.location.origin);
        const query = parsed.search || '';
        if (query.includes('imageMogr2') || query.includes('x-oss-process')) {
          parsed.search = '';
        }
        return parsed.href;
      } catch (error) {
        return rawUrl.split('?imageMogr2')[0].split('?x-oss-process')[0];
      }
    }

    function getOriginalDownloadUrl(item) {
      return stripImageProcessQuery(getOriginalUrl(item));
    }

    function buildDownloadFilename(item, fallbackExt = 'png') {
      const sourceUrl = getOriginalDownloadUrl(item) || getDisplayUrl(item);
      let name = String(item?.title || '').trim();
      try {
        const parsed = new URL(sourceUrl, window.location.origin);
        const pathName = decodeURIComponent(parsed.pathname.split('/').pop() || '');
        if (pathName) name = pathName;
      } catch (error) {
      }
      name = name.replace(/[\\/:*?"<>|]+/g, '-').replace(/\s+/g, ' ').trim();
      if (!name) name = `generation-image-${Date.now()}.${fallbackExt}`;
      if (!/\.[a-z0-9]{2,5}$/i.test(name)) name = `${name}.${fallbackExt}`;
      return name;
    }

    function buildAppUrl(path) {
      return new URL(path, window.location.origin).href;
    }

    function downloadBlobUrl(url, filename) {
      const link = document.createElement('a');
      link.href = url;
      link.download = filename || '';
      link.style.display = 'none';
      document.body.appendChild(link);
      link.click();
      link.remove();
    }

    async function downloadZipSynchronously(urls) {
      const response = await fetch(buildAppUrl('/api/generation-history/download-zip'), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Accept: 'application/zip, application/json' },
        credentials: 'same-origin',
        body: JSON.stringify({ urls }),
      });
      const contentType = response.headers.get('content-type') || '';
      if (!response.ok) {
        if (contentType.includes('application/json')) {
          const payload = await response.json().catch(() => ({}));
          throw new Error(payload.error || '同步打包下载失败');
        }
        const text = await response.text().catch(() => '');
        throw new Error(text || '同步打包下载失败');
      }
      const blob = await response.blob();
      if (!blob.size) {
        throw new Error('打包文件为空');
      }
      const blobUrl = URL.createObjectURL(blob);
      const filename = `generation-history-originals-${Date.now()}.zip`;
      downloadBlobUrl(blobUrl, filename);
      setTimeout(() => URL.revokeObjectURL(blobUrl), 1000);
    }

    async function triggerZipDownload(downloadUrl) {
      if (!downloadUrl) return;
      try {
        const response = await fetch(buildAppUrl(downloadUrl), {
          method: 'GET',
          credentials: 'same-origin',
          cache: 'no-store',
        });
        if (!response.ok) {
          const contentType = response.headers.get('content-type') || '';
          if (contentType.includes('application/json')) {
            const payload = await response.json().catch(() => ({}));
            throw new Error(payload.error || '下载打包文件失败');
          }
          throw new Error(`下载失败：${response.status} ${response.statusText}`);
        }
        const blob = await response.blob();
        if (!blob.size) {
          throw new Error('打包文件为空');
        }
        const blobUrl = URL.createObjectURL(blob);
        downloadBlobUrl(blobUrl, `generation-history-originals-${Date.now()}.zip`);
        setTimeout(() => URL.revokeObjectURL(blobUrl), 1000);
      } catch (error) {
        alert(error.message || '下载打包文件失败');
      }
    }

    async function waitForZipTask(taskId) {
      for (let index = 0; index < 120; index += 1) {
        const response = await fetch(buildAppUrl(`/api/generation-history/zip-tasks/${encodeURIComponent(taskId)}`), {
          credentials: 'same-origin',
          cache: 'no-store',
        });
        const payload = await response.json().catch(() => ({}));
        const task = payload?.task || {};
        if (!response.ok || !payload.success) {
          throw new Error(payload.error || '查询打包任务失败');
        }
        if (task.status === 'succeeded' && task.download_url) {
          return task.download_url;
        }
        if (task.status === 'failed') {
          throw new Error(task.error || payload.error || '打包下载失败');
        }
        await new Promise((resolve) => setTimeout(resolve, 1000));
      }
      throw new Error('打包任务等待超时，请稍后重试');
    }

    async function downloadSelectedOriginals() {
      const selectedItems = getSelectedItems();
      if (!selectedItems.length) {
        alert('请先选择要打包下载的图片');
        return;
      }
      const urls = selectedItems.map((item) => getOriginalDownloadUrl(item)).filter(Boolean);
      if (!urls.length) {
        alert('选中的图片没有可下载的原图地址');
        return;
      }
      downloadBtn.disabled = true;
      downloadBtn.classList.add('disabled');
      downloadBtn.textContent = '打包中...';
      try {
        await downloadZipSynchronously(urls);
      } catch (error) {
        try {
          downloadBtn.textContent = '重试打包中...';
          const response = await fetch(buildAppUrl('/api/generation-history/zip-tasks'), {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
            credentials: 'same-origin',
            body: JSON.stringify({ urls }),
          });
          const payload = await response.json().catch(() => ({}));
          if (!response.ok || !payload.success) {
            throw new Error(payload.error || '异步打包任务创建失败');
          }
          const downloadUrl = await waitForZipTask(payload.task_id);
          await triggerZipDownload(downloadUrl);
        } catch (fallbackError) {
          alert(fallbackError.message || error.message || '打包下载失败');
        }
      } finally {
        updateDownloadButtonState();
      }
    }

    function getDisplayUrl(item) {
      return item?.imageUrl || item?.thumbUrl || getOriginalUrl(item);
    }

    function getPreviewDisplayUrl(item) {
      return item?.thumbUrl || item?.imageUrl || getOriginalUrl(item);
    }

    async function downloadSingleDisplayImage(item) {
      const url = getOriginalDownloadUrl(item) || stripImageProcessQuery(getDisplayUrl(item));
      if (!url) return;
      const downloadUrl = buildAppUrl(`/api/generation-history/download-image?url=${encodeURIComponent(url)}`);
      try {
        const response = await fetch(downloadUrl, {
          method: 'GET',
          credentials: 'same-origin',
          cache: 'no-store',
        });
        if (!response.ok) {
          const contentType = response.headers.get('content-type') || '';
          if (contentType.includes('application/json')) {
            const payload = await response.json().catch(() => ({}));
            throw new Error(payload.error || '下载图片失败');
          }
          throw new Error(`下载失败：${response.status} ${response.statusText}`);
        }
        const blob = await response.blob();
        if (!blob.size) {
          throw new Error('图片文件为空');
        }
        const blobUrl = URL.createObjectURL(blob);
        downloadBlobUrl(blobUrl, buildDownloadFilename(item));
        setTimeout(() => URL.revokeObjectURL(blobUrl), 1000);
      } catch (error) {
        alert(error.message || '下载图片失败');
      }
    }

    function removeBrokenImageCard(card) {
      if (!card) return;
      const id = card.dataset.id;
      if (id) {
        state.selected.delete(id);
        if (state.previewId === id) {
          closePreview();
        }
      }
      card.remove();
      document.querySelectorAll('.timeline-group').forEach((group) => {
        if (!group.querySelector('.image-card')) group.remove();
      });
      updateLoadMoreState();
      updateDownloadButtonState();
    }

    function renderTimeline(currentUserLabel = '') {
      const visibleItems = getVisibleItems();
      const visibleDates = new Set(galleryData.slice(0, state.visibleDays).map((group) => group.date));
      const groupedVisible = galleryData
        .filter((group) => visibleDates.has(group.date))
        .map((group) => ({
          ...group,
          items: group.items.filter((item) => visibleItems.some((visible) => visible.id === item.id)),
        }))
        .filter((group) => group.items.length > 0);

      if (!groupedVisible.length) {
        const accountText = currentUserLabel ? `当前账号：${escapeHtml(currentUserLabel)}。` : '';
        timelineBlock.innerHTML = `<div style="color:#000;padding:40px 0;">暂无历史生成记录。${accountText}请确认当前登录账号是否是刚才生成图片的账号。</div>`;
        return;
      }

      timelineBlock.innerHTML = groupedVisible.map((group) => `
        <section class="timeline-group" data-group-date="${group.date}">
          <div class="group-head">
            <div>
              <h2>${group.label}</h2>
            </div>
          </div>
          <div class="waterfall-grid">
            ${group.items.map((item, itemIndex) => renderCard(item, itemIndex)).join('')}
          </div>
        </section>
      `).join('');
      syncSelectionUI();
    }

    function renderCard(item, itemIndex) {
      const selected = state.selected.has(item.id) ? 'selected' : '';
      const previewing = state.previewId === item.id ? 'previewing' : '';
      const delay = itemIndex * 35;
      const thumbUrl = item.thumbUrl || item.imageUrl;
      return `
        <article class="image-card ${selected} ${previewing}" data-id="${escapeHtml(item.id)}" data-date="${escapeHtml(item.date || '')}" style="animation-delay:${delay}ms;">
          <span class="select-box">✓</span>
          <div class="thumb"><img src="${escapeHtml(thumbUrl)}" data-original="${escapeHtml(item.imageUrl)}" loading="lazy" decoding="async" alt="${escapeHtml(item.title || '历史图片')}"></div>
        </article>
      `;
    }

    timelineBlock.addEventListener('error', (event) => {
      const target = event.target;
      if (!target || target.tagName !== 'IMG') return;
      removeBrokenImageCard(target.closest('.image-card'));
    }, true);

    function syncSelectionUI() {
      document.querySelectorAll('.image-card').forEach((card) => {
        card.classList.toggle('selected', state.selected.has(card.dataset.id));
      });
      updateDownloadButtonState();
    }

    function toggleSelect(id) {
      if (!id) return;
      if (state.selected.has(id)) {
        state.selected.delete(id);
      } else {
        state.selected.add(id);
      }
      syncSelectionUI();
    }

    function openPreview(id) {
      state.previewId = id;
      const item = getItemById(id);
      if (!item) return;
      previewTitle.textContent = item.title;
      previewSubTitle.textContent = `${item.dateLabel} · ${item.kind === 'generated' ? '生成图' : '参考图'}`;
      previewInfo.textContent = `日期：${item.dateLabel}，来源：${item.source}，当前标签数：${item.tags.length}`;
      previewTags.textContent = item.tags.join(' / ');
      previewSource.textContent = `${item.source} / ${item.kind}`;
      previewModal.classList.add('open');
      previewModal.setAttribute('aria-hidden', 'false');
      renderPreview();
    }

    function closePreview() {
      previewModal.classList.remove('open');
      previewModal.setAttribute('aria-hidden', 'true');
      state.previewId = null;
    }

    function renderPreview() {
      const item = state.previewId ? getItemById(state.previewId) : null;
      if (!item) return;
      const displayUrl = getPreviewDisplayUrl(item);
      if (displayUrl) {
        previewFrame.classList.remove('empty');
        previewFrame.innerHTML = `<img src="${escapeHtml(displayUrl)}" alt="${escapeHtml(item.title || '图片预览')}" decoding="async">`;
        return;
      }
      previewFrame.classList.add('empty');
      previewFrame.innerHTML = '';
    }

    loadMoreBtn.addEventListener('click', () => {
      if (state.loadingMore || !state.hasMore) return;
      loadHistoryData(false).catch((error) => {
        console.error(error);
        alert('加载更多失败');
      });
    });

    document.getElementById('closePreviewBtn').addEventListener('click', closePreview);

    let dragState = null;
    let dragTargetId = null;
    let dragCandidateIds = [];
    let dragActivated = false;
    const DRAG_THRESHOLD = 5;

    document.addEventListener('mousedown', (event) => {
      const card = event.target.closest('.image-card');
      const isLeftButton = event.button === 0;
      if (!isLeftButton || event.target.closest('button, a, input, textarea, select')) return;
      dragState = {
        x: event.clientX,
        y: event.clientY,
      };
      dragTargetId = card ? card.dataset.id : null;
      dragCandidateIds = dragTargetId ? [dragTargetId] : [];
      dragActivated = false;
      event.preventDefault();
    });

    document.addEventListener('mousemove', (event) => {
      if (!dragState) return;
      const deltaX = Math.abs(event.clientX - dragState.x);
      const deltaY = Math.abs(event.clientY - dragState.y);
      const movedEnough = deltaX >= DRAG_THRESHOLD || deltaY >= DRAG_THRESHOLD;
      if (!dragActivated && !movedEnough) return;
      if (!dragActivated) {
        dragActivated = true;
        rangeOverlay.classList.add('active');
      }
      const left = Math.min(dragState.x, event.clientX);
      const top = Math.min(dragState.y, event.clientY);
      const width = Math.abs(event.clientX - dragState.x);
      const height = Math.abs(event.clientY - dragState.y);
      rangeBox.style.left = `${left}px`;
      rangeBox.style.top = `${top}px`;
      rangeBox.style.width = `${width}px`;
      rangeBox.style.height = `${height}px`;
      const rect = { left, top, right: left + width, bottom: top + height };
      dragCandidateIds = [];
      document.querySelectorAll('.image-card').forEach((card) => {
        const cardRect = card.getBoundingClientRect();
        const overlap = !(cardRect.right < rect.left || cardRect.left > rect.right || cardRect.bottom < rect.top || cardRect.top > rect.bottom);
        card.classList.toggle('drag-over', overlap);
        if (overlap) dragCandidateIds.push(card.dataset.id);
      });
    });

    document.addEventListener('mouseup', () => {
      if (!dragState) return;
      if (!dragActivated) {
        if (dragTargetId) toggleSelect(dragTargetId);
        dragState = null;
        dragTargetId = null;
        dragCandidateIds = [];
        return;
      }
      dragState = null;
      dragActivated = false;
      rangeOverlay.classList.remove('active');
      document.querySelectorAll('.image-card').forEach((card) => card.classList.remove('drag-over'));
      const onlySelected = dragCandidateIds.length > 0 && dragCandidateIds.every((id) => state.selected.has(id));
      if (onlySelected) {
        dragCandidateIds.forEach((id) => state.selected.delete(id));
      } else {
        dragCandidateIds.forEach((id) => state.selected.add(id));
      }
      dragCandidateIds = [];
      syncSelectionUI();
    });

    downloadBtn.addEventListener('click', downloadSelectedOriginals);

    document.getElementById('previewDownloadBtn').addEventListener('click', () => {
      const item = state.previewId ? getItemById(state.previewId) : null;
      if (!item) return;
      downloadSingleDisplayImage(item);
    });
    previewModal.addEventListener('click', (event) => {
      if (event.target === previewModal) closePreview();
    });

    timelineBlock.addEventListener('click', (event) => {
      const card = event.target.closest('.image-card');
      if (!card) return;
      openPreview(card.dataset.id);
    });

    updateDownloadButtonState();

    loadHistoryData(true).catch((error) => {
      console.error(error);
      timelineBlock.innerHTML = '<div style="color:#000">读取历史生成数据失败</div>';
    });
  </script>
</body>
</html>
